<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css?v=1.0.16">
    <link rel="stylesheet" href="theme.css?v=1.0.16">
    <title>PL-900 Quiz</title>
</head>
<body>
    <div id="quiz-container">
        <div id="quiz-header">
            <h1>PL-900 Quiz</h1>
            <a id="hub-link" href="index.html">&#127968; Hub</a>
            <a id="user-guide-link" href="user-guide.html?exam=PL-900" target="_blank">&#128214; User Guide</a>
            <button id="home-btn" style="display:none;">&#127968; Main Page</button>
        </div>
        <div id="set-selection" style="display: none;"></div>
        <div id="timer-display" style="display: none;"></div>
        <div id="question"></div>
        <div id="choices"></div>
        <button id="next-button" style="display: none;">Next</button>
        <div id="score-summary" style="display: none;"></div>
    </div>
    <div id="confirm-overlay" style="display:none;">
        <div id="confirm-card">
            <h2 id="confirm-title"></h2>
            <p id="confirm-message"></p>
            <div class="resume-buttons">
                <button id="confirm-yes-btn" class="resume-btn">Yes</button>
                <button id="confirm-no-btn" class="new-quiz-btn">Cancel</button>
            </div>
        </div>
    </div>
    <div id="pause-overlay" style="display:none;">
        <div id="pause-card">
            <div class="pause-icon">&#9646;&#9646;</div>
            <h2>Quiz Paused</h2>
            <p>You've been inactive for 2 minutes.<br>Your progress has been saved.</p>
            <div class="resume-buttons">
                <button id="pause-resume-btn" class="resume-btn">&#9654; Continue Quiz</button>
                <button id="pause-home-btn" class="new-quiz-btn">&#127968; Main Page</button>
            </div>
        </div>
    </div>
    <div id="mode-overlay" style="display:none;">
        <div id="mode-card">
            <h2>&#127891; Choose Quiz Mode</h2>
            <p>How would you like to take this quiz?</p>
            <div class="mode-options">
                <button class="mode-btn" id="practice-mode-btn">
                    <div class="mode-icon-lg">&#128214;</div>
                    <div class="mode-title">Practice Mode</div>
                    <div class="mode-desc">Correct answers are shown after each question</div>
                </button>
                <button class="mode-btn" id="test-mode-btn">
                    <div class="mode-icon-lg">&#128221;</div>
                    <div class="mode-title">Test Mode</div>
                    <div class="mode-desc">Answers revealed only on the evaluation screen</div>
                </button>
            </div>
            <button class="new-quiz-btn" id="mode-cancel-btn">Cancel</button>
        </div>
    </div>

    <!-- Test-mode peek score overlay -->
    <div id="peek-overlay" style="display:none;">
        <div id="peek-card">
            <div class="peek-emoji" id="peek-emoji">&#128527;</div>
            <h2 id="peek-title">Afraid to continue?</h2>
            <div class="peek-score-display">
                <span class="peek-pct" id="peek-pct">0%</span>
                <span class="peek-detail" id="peek-detail">0 of 0 answered</span>
            </div>
            <p class="peek-taunt" id="peek-taunt"></p>
            <div class="resume-buttons">
                <button id="peek-continue-btn" class="resume-btn">&#128170; Keep Going!</button>
                <button id="peek-quit-btn" class="new-quiz-btn">&#127987;&#65039; Give Up</button>
            </div>
        </div>
    </div>

    <!-- Quick Practice streak milestone overlay -->
    <div id="streak-overlay" style="display:none;">
        <div id="streak-card">
            <div class="streak-icon" id="streak-icon">&#128293;</div>
            <div class="streak-msg" id="streak-msg">KILLING SPREE!</div>
            <div class="streak-count" id="streak-count">5 in a row!</div>
            <button class="streak-dismiss-btn" id="streak-dismiss-btn">&#128293; Keep It Up!</button>
        </div>
    </div>

    <script src="pl900-questions.js?v=1.0.21"></script>
    <script src="pl900-questions2.js"></script>
    <script src="pl900-questions3.js"></script>
    <script src="pl900-context-revisions.js?v=1.0.21"></script>
    <script src="pl900-passleader-archive.js"></script>
    <script src="pl900-testcases.js"></script>
    <script>
      window.QUIZ_CONFIG = {
        prefix:    "pl900",
        examName:  "PL-900",
        examTitle: "PL-900 Quiz",
        randomQuizMin: 40,
        randomQuizMax: 45,
        questionSets: [
          {
            key: "foundations",
            label: "Foundations",
            difficulty: "beginner",
            description: "119 questions covering Power Platform fundamentals, Microsoft Dataverse, Power Apps basics, and core platform concepts.",
            data: pl900Questions
          },
          {
            key: "workloads",
            label: "Workloads & Automation",
            difficulty: "intermediate",
            description: "122 questions covering Power Automate, Power BI, Copilot Studio, connectors, and workload integration scenarios.",
            data: pl900Questions2
          },
          {
            key: "practice",
            label: "Advanced Practice",
            difficulty: "advanced",
            description: "123 questions covering AI Builder, Power Pages, advanced platform administration, security, and licensing scenarios.",
            data: pl900Questions3
          },
          {
            key: "passleader_archive",
            label: "PassLeader Archive",
            difficulty: "advanced",
            description: "32 questions from the supplied 2020-2022 PassLeader PDFs that match the verified PL-900 bank. Unverified source entries are excluded.",
            data: PL900_PASSLEADER_ARCHIVE_QUESTIONS
          }
        ],
        testCases: PL900_TEST_CASES,
        categoryFn: function (id) {
          if (id >= 9245) return "Advanced Practice";
          if (id >= 9120) return "Workloads & Automation";
          return "Foundations";
        }
      };
    </script>
    <script src="app.js?v=1.0.20"></script>
</body>
</html>
